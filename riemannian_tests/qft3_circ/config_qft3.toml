[system]
nlevels = [2, 2, 2]
nessential = [2, 2, 2]
total_time = 200.0
ntime = 1327
# dt = 0.15071590052750566
transition_frequency = [4.94, 5.0, 5.06]
selfkerr = [0.0, 0.0, 0.0]
crosskerr_coupling = 0.0
dipole_coupling = [
  { subsystem = [0, 1], value = 0.005 },
  { subsystem = [0, 2], value = 0.005 },
  { subsystem = [1, 2], value = 0.005 },
]
rotation_frequency = [5.0, 5.0, 5.0]
decoherence = { type = "none" }
initial_condition = { type = "basis" }

[control]
control_only_p_drive = false
parameterization = { type = "spline", num = 69 }
carrier_frequency = [
  { subsystem = 0, value = [0.06041522986797246, 0.0, -0.06041522986797243] },
  { subsystem = 1, value = [0.06041522986797246, 0.0, -0.06041522986797243] },
  { subsystem = 2, value = [0.06041522986797246, 0.0, -0.06041522986797243] },
]
initialization = [
  { subsystem = 0, type = "random", amplitude = 0.0023570226039551583 },
  { subsystem = 1, type = "random", amplitude = 0.0023570226039551583 },
  { subsystem = 2, type = "random", amplitude = 0.0023570226039551583 },
]
amplitude_bound = 1.0e12
zero_boundary_condition = false

[optimization]
target = { type = "gate", gate_type = "qft", gate_rot_freq = [0.0, 0.0, 0.0] }
objective = "Jtrace"
tolerance = { grad_abs = 1e-05, grad_rel = 1e-05, final_cost = 1e-08, infidelity = 1e-06 }
maxiter = 300
tikhonov = { coeff = 1e-05, use_x0 = false }
penalty = { leakage = 0.0, energy = 0.0, dpdm = 0.0, variation = 0.0, weightedcost = 0.0, weightedcost_width = 0.0 }
solver_type = "gauss_newton"
gn_ksp_rtol = 1e-5
gn_ksp_damping = 1e-5
gn_ksp_solution_norm_threshold = 1.0
gn_ksp_maxiter = 100
gn_ksp_warmstart = false
gn_ksp_type = "minres"
gn_minres_qlp = true  

[output]
directory = "./"
# observables = ["population", "expectedEnergy", "fullstate"]
timestep_stride = 1
optimization_stride = 1

[solver]
runtype = "optimization"
usematfree = true
linearsolver = { type = "gmres", maxiter = 20 }
timestepper = "IMR"
rand_seed = 1122

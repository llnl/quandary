[system]
nlevels = [2, 2, 2, 2]
nessential = [2, 2, 2, 2]
total_time = 300.0
ntime = 3316
dt = 0.09047044632086852
transition_frequency = [4.94, 5.0, 5.06, 5.12]
selfkerr = [0.0, 0.0, 0.0, 0.0]
crosskerr_coupling = 0.0
dipole_coupling = [
  { subsystem = [0, 1], value = 0.005 },
  { subsystem = [0, 2], value = 0.0 },
  { subsystem = [0, 3], value = 0.0 },
  { subsystem = [1, 2], value = 0.005 },
  { subsystem = [1, 3], value = 0.0 },
  { subsystem = [2, 3], value = 0.005 },
]
rotation_frequency = [5.03, 5.03, 5.03, 5.03]
decoherence = { type = "none" }
initial_condition = { type = "basis" }

[control]
control_only_p_drive = false
parameterization = { type = "spline", num = 102 }
carrier_frequency = [
  { subsystem = 0, value = [0.09041523150627062, 0.030001431826955, -0.030001431826955853, -0.09041523150627151] },
  { subsystem = 1, value = [0.09041523150627062, 0.030001431826955, -0.030001431826955853, -0.15041809516018134, -0.09041523150627151, -0.2108318948394961] },
  { subsystem = 2, value = [0.09041523150627062, 0.030001431826955, -0.030001431826955853, -0.15041809516018134, -0.09041523150627151, -0.2108318948394961] },
  { subsystem = 3, value = [0.09041523150627062, 0.030001431826955, -0.030001431826955853, -0.09041523150627151] },
]
initialization = [
  { subsystem = 0, type = "random", amplitude = 0.0017677669529663686 },
  { subsystem = 1, type = "random", amplitude = 0.0011785113019775792 },
  { subsystem = 2, type = "random", amplitude = 0.0011785113019775792 },
  { subsystem = 3, type = "random", amplitude = 0.0017677669529663686 },
]
amplitude_bound = 1.0e12
zero_boundary_condition = false

[optimization]
target = { type = "gate", gate_type = "qft", gate_rot_freq = [0.0, 0.0, 0.0, 0.0] }
objective = "Jtrace"
tolerance = { grad_abs = 1e-05, grad_rel = 1e-05, final_cost = 1e-08, infidelity = 1e-05 }
maxiter = 1000
tikhonov = { coeff = 1e-05, use_x0 = false }
penalty = { leakage = 0.0, energy = 0.0, dpdm = 0.0, variation = 0.0, weightedcost = 0.0, weightedcost_width = 0.0 }
solver_type = "gauss_newton"
# gn_ksp_rtol = 0.1
# gn_ksp_maxiter = 100

gn_ksp_damping = 1e-3
gn_ksp_solution_norm_threshold = 10.0

# std cg settings
# gn_ksp_maxiter = 100
# gn_ksp_warmstart = false
# gn_ksp_rtol = 0.1
# gn_ksp_type = "cg"
# gn_minres_qlp = false

# minres-qlp settings
gn_ksp_maxiter = 150
gn_ksp_warmstart = false
gn_ksp_rtol = 1e-4
gn_ksp_type = "minres"
gn_minres_qlp = true 

[output]
directory = "./"
# observables = ["population", "expectedEnergy", "fullstate"]
timestep_stride = 1
optimization_stride = 1

[solver]
runtype = "optimization"
usematfree = true
linearsolver = { type = "gmres", maxiter = 20 }
timestepper = "IMR"
rand_seed = 1128

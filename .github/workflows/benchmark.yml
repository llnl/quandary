name: Process Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_data:
        description: 'Base64 encoded benchmark data'
        required: true
      benchmark_name:
        description: 'Name for benchmark group on the dashboard'
        required: false
        default: 'Quandary benchmarks'
      commit_sha:
        description: 'Commit SHA the benchmark data corresponds to'
        required: true
      source_ref:
        description: 'Original GitLab ref when the workflow is dispatched on a different branch'
        required: false

jobs:
  check-performance:
    if: inputs.source_ref != '' || github.ref != 'refs/heads/main'
    permissions:
      # Needed to write PR check status
      checks: write
      # Need write for commit comments
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Find associated PR
        id: findpr
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid benchmark commit SHA: $COMMIT_SHA" >&2
            exit 1
          fi

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$COMMIT_SHA\") | .number")

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Expected one open PR with head SHA $COMMIT_SHA; found: ${PR_NUMBER:-none}" >&2
            exit 1
          fi

          PR_HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [ "$PR_HEAD_SHA" != "$COMMIT_SHA" ]; then
            echo "PR #${PR_NUMBER} now points to ${PR_HEAD_SHA}, not benchmarked commit ${COMMIT_SHA}" >&2
            exit 1
          fi

          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}

      - name: Decode benchmark data
        run: echo "${{ github.event.inputs.benchmark_data }}" | base64 -d > benchmark.json

      - name: Compare benchmark result
        id: benchmark
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark.json
          ref: ${{ github.event.inputs.commit_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-always: true
          comment-on-alert: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: '120%'
          max-items-in-chart: 100

      - name: Create Check for PRs
        if: steps.findpr.outputs.pr_number != ''
        uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Performance Benchmark
          sha: ${{ github.event.inputs.commit_sha }}
          conclusion: ${{ steps.benchmark.outcome == 'success' && 'success' || 'failure' }}
          output: |
            {
              "title": "Performance Results",
              "summary": "${{ steps.benchmark.outcome == 'success' && 'Performance check passed' || 'Performance regression detected!' }}",
              "text_description": "See job summary for detailed benchmark results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Final status
        if: steps.benchmark.outcome != 'success'
        run: exit 1

  store-and-visualize-on-main:
    if: github.ref == 'refs/heads/main' && inputs.source_ref == ''
    permissions:
      # Needed to push to gh-pages branch
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Decode benchmark data
        run: echo "${{ github.event.inputs.benchmark_data }}" | base64 -d > benchmark.json

      - name: Store benchmark result
        id: benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark.json
          ref: ${{ github.event.inputs.commit_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-always: false
          comment-on-alert: false
          summary-always: true
          fail-on-alert: false
          alert-threshold: '120%'
          max-items-in-chart: 100
